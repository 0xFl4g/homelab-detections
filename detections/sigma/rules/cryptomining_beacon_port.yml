title: Cryptomining beacon to stratum-typical port
id: d6e4f3a5-3c7b-4e9f-a1b2-2c3d4e5f6a7b
status: stable
description: |
  Internal host beaconing to a public IP on a port commonly used by cryptocurrency
  mining pools (stratum protocol). Mirror of Wazuh rule 100049 — purely
  port-signature based, no CDB lookup, so will fire on any internal host
  contacting these ports regardless of the destination IP's reputation.
references:
  - https://attack.mitre.org/techniques/T1496/
  - https://en.bitcoin.it/wiki/Stratum_mining_protocol
author: 0xFl4g
date: 2026/05/01
tags:
  - attack.impact
  - attack.t1496
logsource:
  category: network
  product: netflow
detection:
  selection_internal_src:
    src|startswith:
      - '10.20.20.'
      - '10.20.25.'
      - '10.10.'
  selection_mining_port:
    dst_port:
      - 3333
      - 4444
      - 5555
      - 7777
      - 14433
      - 14444
  filter_internal_dst:
    dst|startswith:
      - '10.'
      - '192.168.'
      - '172.16.'
      - '172.17.'
      - '172.18.'
      - '172.19.'
      - '172.20.'
      - '172.21.'
      - '172.22.'
      - '172.23.'
      - '172.24.'
      - '172.25.'
      - '172.26.'
      - '172.27.'
      - '172.28.'
      - '172.29.'
      - '172.30.'
      - '172.31.'
  condition: selection_internal_src and selection_mining_port and not filter_internal_dst
falsepositives:
  - Legitimate use of these ports by non-mining services (rare; stratum-style
    protocols are not common on these specific ports outside mining)
level: critical
