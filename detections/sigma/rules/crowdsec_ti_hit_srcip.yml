title: CrowdSec-known malicious IP observed in logs
id: a9d3e1c2-7b6f-4d8e-9c0a-1f2e3d4c5b6a
status: stable
description: |
  Source IP appears in the CrowdSec CAPI threat-intel list. Mirror of Wazuh rule
  100040 (text-decoder path) and 100250 (Vector-enriched JSON path).
references:
  - https://www.crowdsec.net/
  - https://attack.mitre.org/techniques/T1071/
author: 0xFl4g
date: 2026/05/01
tags:
  - attack.command-and-control
  - attack.t1071
logsource:
  category: network
detection:
  selection:
    threat_intel.crowdsec|exists: true
  filter_empty:
    threat_intel.crowdsec: ''
  condition: selection and not filter_empty
falsepositives:
  - CrowdSec CAPI false positive (rare; their consensus model filters most)
  - Newly-rotated public IP previously assigned to a malicious actor
level: high
