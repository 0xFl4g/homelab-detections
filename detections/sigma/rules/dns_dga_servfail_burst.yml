title: DNS DGA pattern — high SERVFAIL rate from single client
id: f8a7b6c3-be5f-4a7b-c9d0-ad1e2f3a4b5c
status: stable
description: |
  20+ SERVFAIL responses to a single client in 5 minutes — pattern of a Domain
  Generation Algorithm (DGA) iterating through randomly-generated names looking
  for an active C2 rendezvous. Mirror of Wazuh rule 100305.
references:
  - https://attack.mitre.org/techniques/T1568/002/
  - https://en.wikipedia.org/wiki/Domain_generation_algorithm
author: 0xFl4g
date: 2026/05/01
tags:
  - attack.command-and-control
  - attack.t1568.002
logsource:
  category: dns
detection:
  selection:
    response_code: SERVFAIL
  condition: selection
# Note: aggregation (20+ SERVFAIL in 5m by srcip) is enforced in Wazuh native
# rule 100305 via <frequency>20</frequency><timeframe>300</timeframe>.
falsepositives:
  - Misconfigured legitimate client retrying against an intermittently-down
    upstream resolver
  - DNSSEC validation failures on a particular legitimate domain (filter by
    common-failure domain set)
level: high
