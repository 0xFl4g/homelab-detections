title: Credential file search via find (Linux)
id: 6b1d3e92-4a57-4f8c-b2e1-0c9a7f5d8e23
status: experimental
description: find invoked to locate credential-bearing config files (T1552.001). Missed by prebuilt Linux rules in the lab coverage run.
references: [https://attack.mitre.org/techniques/T1552/001/]
author: 0xFl4g
date: 2026-10-17
logsource:
  category: process_creation
  product: linux
detection:
  finder:
    Image|endswith: /find
  credfiles:
    CommandLine|contains: ['.git-credentials', '.npmrc', '.vault-token', '.travis.yml', '.gitlab-ci.yml', '.aws/credentials', 'id_rsa', '.env']
  condition: finder and credfiles
falsepositives: [Developer or CI tooling searching project trees]
level: medium
tags: [attack.credential-access, attack.t1552.001]
