name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  sigma:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install sigma-cli
        run: |
          uv tool install sigma-cli==3.1.0 --with pysigma==1.5.1 --with pysigma-backend-elasticsearch==2.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint Sigma rules
        run: sigma check --fail-on-issues detections/sigma/rules/
      - name: Sigma to Elastic conversion self-test
        run: bash detections/sigma/test-convert-elastic.sh

  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch the current MITRE ATT&CK release
        run: curl -sfL -o /tmp/enterprise-attack.json https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
      - name: Check Elastic rules and ATT&CK map
        run: python3 scripts/check-rules.py . /tmp/enterprise-attack.json

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Leak scan (public IPs, tailnet IPs, emails)
        run: bash scripts/scrub-check.sh .
      - name: gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
